name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The e2e tests drive the real bridge script (sv-scripts/*.lua) through
      # test/sv-stub.lua and skip when no `lua` binary is available — install
      # one so they actually run in CI.
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua
          lua -v

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
